name: myagent_prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - myagent_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - myagent_internal

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_prod_data:/data
      - neo4j_prod_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - myagent_internal

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    restart: unless-stopped
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_prod_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - myagent_internal

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_prod_data:/minio_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - myagent_internal

  milvus:
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - milvus_prod_data:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - myagent_internal

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks:
      - myagent_internal

  ollama-init:
    image: ${MYAGENT_IMAGE:-myagent2:prod}
    restart: "no"
    env_file:
      - ${MYAGENT_ENV_FILE:-.env.prod}
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    entrypoint: ["/app/scripts/docker/ollama-init.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - myagent_internal

  myagent-migrate:
    image: ${MYAGENT_IMAGE:-myagent2:prod}
    restart: "no"
    env_file:
      - ${MYAGENT_ENV_FILE:-.env.prod}
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myagent_internal

  myagent-api:
    image: ${MYAGENT_IMAGE:-myagent2:prod}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${MYAGENT_ENV_FILE:-.env.prod}
    ports:
      - "${MYAGENT_API_BIND_ADDRESS:-127.0.0.1}:${MYAGENT_API_PORT:-8000}:8000"
    volumes:
      - rag_prod_storage:/app/rag_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy
      myagent-migrate:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - myagent_internal

  myagent-rag-import:
    image: ${MYAGENT_IMAGE:-myagent2:prod}
    restart: "no"
    profiles: ["rag-import"]
    env_file:
      - ${MYAGENT_ENV_FILE:-.env.prod}
    entrypoint: ["/app/scripts/docker/rag-import.sh"]
    volumes:
      - rag_prod_storage:/app/rag_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      myagent-migrate:
        condition: service_completed_successfully
    networks:
      - myagent_internal

volumes:
  postgres_prod_data:
  redis_prod_data:
  neo4j_prod_data:
  neo4j_prod_logs:
  etcd_prod_data:
  minio_prod_data:
  milvus_prod_data:
  ollama_models:
  rag_prod_storage:

networks:
  myagent_internal:
    driver: bridge

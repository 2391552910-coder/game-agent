[project]
name = "myAgent"
version = "2.0.0"
description = "Multi-tenant game player behavior analysis and prediction platform"
requires-python = ">=3.11,<3.13" 
dependencies = [
    # ==================== Core ====================
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    # ==================== Database ====================
    "sqlalchemy[asyncio]>=2.0.46",
    "asyncpg>=0.30.0",
    "alembic>=1.18.1",
    # ==================== Redis ====================
    "redis[hiredis]>=7.0.0",
    # ==================== Neo4j ====================
    "neo4j>=5.27.0",
    # ==================== Milvus ====================
    "pymilvus>=2.5.0",
    # ==================== LangGraph + LangChain ====================
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.1",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=0.1.0",
    # ==================== LightRAG ====================
    "lightrag-hku>=1.4.0",
    # ==================== Prefect ====================
    "prefect>=3.5.0",
    # ==================== Utilities ====================
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "sse-starlette>=2.2.0",
    "tenacity>=9.0.0",
    "psycopg2>=2.9.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "locust>=2.32.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["myagent", "myAgent", "."]
packages = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-socket>=0.7.0",
]
